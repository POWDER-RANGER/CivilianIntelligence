name: CIVINT ingest

# Nightly keyless pull of NWS alerts + USAspending awards.
# Publishes dashboard-ready JSON into public/civint/ on this branch so the
# Veil loaders (/civint/alerts.json, /civint/awards.json) stay live.
#
# Required repo variable (Settings → Variables):
#   NWS_USER_AGENT   e.g. "CIVINT (contact: you@real-address)"
#
# Optional:
#   CIVINT_STATES    space-separated, default "IA IL MO"
#   CIVINT_TERMS     space-separated search terms for USAspending

on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - name: Install
        run: pip install -r ingest/requirements.txt

      - name: Run NWS + USAspending
        env:
          NWS_USER_AGENT: ${{ vars.NWS_USER_AGENT }}
          CIVINT_OUT: civint_data
        run: |
          set -euo pipefail
          if [ -z "${NWS_USER_AGENT:-}" ]; then
            echo "NWS_USER_AGENT repo variable is not set — skipping NWS, running USAspending only"
            python ingest/civint_ingest.py usaspending --max-pages 3 || true
          else
            STATES="${{ vars.CIVINT_STATES }}"
            STATES="${STATES:-IA IL MO}"
            python ingest/civint_ingest.py nws --states $STATES
            python ingest/civint_ingest.py usaspending --max-pages 3
          fi

      - name: Publish to public/civint
        run: |
          mkdir -p public/civint
          cp -f civint_data/alerts.json public/civint/ 2>/dev/null || echo "[]" > public/civint/alerts.json
          cp -f civint_data/awards.json public/civint/ 2>/dev/null || echo "[]" > public/civint/awards.json
          ls -la public/civint/

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/civint/
          if git diff --staged --quiet; then
            echo "No ingest changes"
            exit 0
          fi
          git commit -m "data(civint): nightly NWS + USAspending snapshot $(date -u +%Y-%m-%d)"
          git push
