name: CIVINT ingest

# Nightly keyless pull of NWS alerts + USAspending awards.
# Publishes dashboard-ready JSON into public/civint/ so the Veil loaders
# (/civint/alerts.json, /civint/awards.json) stay live. Scheduled workflows only run
# from the default branch, so nothing happens until this file is merged.
#
# Repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   NWS_USER_AGENT   e.g. "CIVINT (contact: you@real-address)"   (NWS skipped with a warning if unset)
#   CIVINT_STATES    optional, space-separated, default "IA IL MO"

on:
  schedule:
    - cron: "15 6 * * *" # 06:15 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: civint-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - name: Install
        run: pip install -r ingest/requirements.txt

      - name: Run NWS + USAspending
        id: run
        env:
          NWS_USER_AGENT: ${{ vars.NWS_USER_AGENT }}
          CIVINT_STATES: ${{ vars.CIVINT_STATES }}
          CIVINT_OUT: civint_data
        run: |
          status=0
          if [ -n "${NWS_USER_AGENT:-}" ]; then
            python ingest/civint_ingest.py nws --states ${CIVINT_STATES:-IA IL MO} || status=1
          else
            echo "::warning::NWS_USER_AGENT repo variable is not set; skipping NWS"
          fi
          python ingest/civint_ingest.py usaspending --max-pages 3 || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Publish to public/civint
        run: |
          mkdir -p public/civint
          for f in alerts awards; do
            if [ -f "civint_data/$f.json" ]; then cp -f "civint_data/$f.json" public/civint/; fi
          done
          ls -la public/civint/

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/civint/
          if git diff --staged --quiet; then
            echo "No ingest changes"
            exit 0
          fi
          git commit -m "data(civint): nightly NWS + USAspending snapshot $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - name: Fail the run if any source failed
        if: steps.run.outputs.status != '0'
        run: |
          echo "::error::One or more ingest sources failed; partial data (if any) was published."
          exit 1
