name: Guide and source quality checks

on:
  push:
    branches: [feat/native-clients]
    paths:
      - "src/components/layout/app-shell.tsx"
      - "src/components/layout/navigator-guide.tsx"
      - "src/components/sources/source-health.tsx"
      - "src/lib/navigator-guide.ts"
      - "src/lib/navigator-guide.test.ts"
      - "scripts/with-app-env.mjs"
      - ".github/workflows/assistant-check.yml"
  pull_request:
    paths:
      - "src/components/layout/app-shell.tsx"
      - "src/components/layout/navigator-guide.tsx"
      - "src/components/sources/source-health.tsx"
      - "src/lib/navigator-guide.ts"
      - "src/lib/navigator-guide.test.ts"
      - "scripts/with-app-env.mjs"
      - ".github/workflows/assistant-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guide-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Test navigation suggestions
        run: node --experimental-strip-types --test src/lib/navigator-guide.test.ts
      - name: Verify frontend bundle
        run: npm run build:dev
      - name: Lint changed guide and source quality components
        run: npx eslint src/components/layout/app-shell.tsx src/components/layout/navigator-guide.tsx src/components/sources/source-health.tsx src/lib/navigator-guide.ts src/lib/navigator-guide.test.ts
