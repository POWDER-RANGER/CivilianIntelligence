name: Native platform builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-build.yml"
  push:
    branches:
      - "feat/native-clients"
    paths:
      - "native/**"
      - ".github/workflows/native-build.yml"

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: native/desktop/package-lock.json
      - name: Install Rust MSVC
        shell: pwsh
        run: rustup update stable-x86_64-pc-windows-msvc
      - name: Install native dependencies
        run: npm ci
      - name: Build NSIS installer
        run: npm run desktop:build -- --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: civintelligence-windows-nsis
          path: native/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux packages (DEB and AppImage)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: native/desktop/package-lock.json
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Update Rust
        run: rustup update stable
      - name: Install native dependencies
        run: npm ci
      - name: Build Linux DEB and AppImage
        run: npm run desktop:build -- --bundles deb,appimage
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: civintelligence-linux
          path: |
            native/desktop/src-tauri/target/release/bundle/deb/*.deb
            native/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS application (DMG)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: native/desktop/package-lock.json
      - name: Update Rust
        run: rustup update stable
      - name: Install native dependencies
        run: npm ci
      - name: Build macOS DMG
        run: npm run desktop:build -- --bundles dmg
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: civintelligence-macos
          path: native/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: native/desktop/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install verified Android command-line tools
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl --fail --location --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$RUNNER_TEMP/android-cli.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/android-cli.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
          mv "$RUNNER_TEMP/android-cli/cmdline-tools/"* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install native dependencies
        run: npm ci
      - name: Sync Android project
        run: npx cap sync android
      - name: Validate Android security manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("android/app/src/main/AndroidManifest.xml").getroot()
          app = root.find("application")
          assert app is not None
          ns = "{http://schemas.android.com/apk/res/android}"
          assert app.get(ns + "allowBackup") == "false", "Android app data backup must be disabled"
          assert app.get(ns + "usesCleartextTraffic") == "false", "Android cleartext traffic must be disabled"
          print("Android backup and cleartext policies verified")
          PY
      - name: Restore Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('native/desktop/android/**/*.gradle', 'native/desktop/android/**/*.gradle.kts', 'native/desktop/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-
      - name: Compile debug APK
        working-directory: native/desktop/android
        run: |
          chmod +x gradlew
          # Retry only dependency-resolution failures caused by upstream HTTP 429/5xx.
          # Compiler and test failures remain fatal on the first attempt.
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --max-workers=2 testDebugUnitTest assembleDebug > "$RUNNER_TEMP/android-gradle.log" 2>&1; then
              cat "$RUNNER_TEMP/android-gradle.log"
              exit 0
            fi
            cat "$RUNNER_TEMP/android-gradle.log"
            if ! grep -Eq "Received status code (429|5[0-9][0-9])|Read timed out|Connection reset" "$RUNNER_TEMP/android-gradle.log"; then
              echo "Non-transient Gradle failure; refusing retry" >&2
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle upstream transient failure persists after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 30))
          done
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: civintelligence-android-debug
          path: native/desktop/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator (unsigned development app)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: native/desktop/package-lock.json
      - name: Install native dependencies
        run: npm ci
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync iOS assets
        run: npx cap sync ios
      - name: Build unsigned iOS simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/CivintelligenceIOS" CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          cd "$RUNNER_TEMP/CivintelligenceIOS/Build/Products/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/civintelligence-ios-simulator.zip"
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: civintelligence-ios-simulator
          path: civintelligence-ios-simulator.zip
          if-no-files-found: error

  provenance:
    name: Verify all native deliverables and checksums
    needs: [windows, linux, macos, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify remote-content configuration safety
        run: python3 native/native_config_policy.py
      - name: Test artifact verifier and native configuration policy
        run: python3 -m unittest discover -s native -p 'test_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          pattern: civintelligence-*
          path: native-artifacts
      - name: Verify packages and generate SHA-256 inventory
        run: python3 native/verify_artifacts.py native-artifacts --commit "$GITHUB_SHA" --out native-provenance
      - name: Upload native artifact provenance
        uses: actions/upload-artifact@v4
        with:
          name: civintelligence-native-provenance
          path: native-provenance/
          if-no-files-found: error
