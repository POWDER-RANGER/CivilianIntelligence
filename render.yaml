services:
  - type: web
    name: civintelligence
    runtime: node
    plan: free
    # The repository lockfile is currently inconsistent with package.json.
    # Use npm install here to resolve the dependency graph at deploy time;
    # restore npm ci once a regenerated package-lock.json is committed.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: "node-server"
      - key: CIVINT_DEPLOYMENT
        value: "production"
      - key: DATABASE_URL
        sync: false
