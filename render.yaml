services:
  - type: web
    name: civintelligence
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: "node-server"
      - key: CIVINT_DEPLOYMENT
        value: "production"
      - key: DATABASE_URL
        sync: false
      - key: CELL_TITAN_BASE_URL
        sync: false
      - key: CELL_TITAN_API_TOKEN
        sync: false
