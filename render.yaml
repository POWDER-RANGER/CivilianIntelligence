services:
  - type: web
    name: civintelligence
    runtime: node
    plan: free
    buildCommand: npm install --package-lock-only --ignore-scripts --no-audit --no-fund && npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: "node-server"
      - key: CIVINT_DEPLOYMENT
        value: "production"
      # Disables the third-party grok.com extensions.js injection (read at
      # runtime by scripts/grok-pwa-shared.mjs). Live audit P1-6.
      - key: VITE_GROK_EXTENSIONS
        value: "0"
      # Optional keys; each feature reports "unconfigured" until set.
      - key: CONGRESS_API_KEY
        sync: false
      - key: FOIA_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: WATCHTOWER_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CELL_TITAN_BASE_URL
        sync: false
      - key: CELL_TITAN_API_TOKEN
        sync: false
